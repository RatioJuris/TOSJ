name: OSJ License Sync

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"   # Runs nightly at midnight UTC

permissions:
  contents: write

jobs:
  osj-convert-license:
    runs-on: ubuntu-latest
    steps:
      - name: OSJ Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: OSJ Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: OSJ Install Dependencies
        run: pip install markdown beautifulsoup4

      - name: OSJ Run License Conversion
        run: |
          python osj_bot/git/file_manager.py OSJ_License.md License.txt

      - name: OSJ Commit License Update
        run: |
          git config --global user.name "OSJ Bot"
          git config --global user.email "osj-bot@users.noreply.github.com"
          git add License.txt osj_bot/git/file_map.json
          git commit -m "OSJ Bot: Synced OSJ_License.md → License.txt" || echo "No changes to commit"
          git push
