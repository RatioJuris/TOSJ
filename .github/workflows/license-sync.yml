name: OSJ License Sync

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: osj-license-sync
  cancel-in-progress: false

jobs:
  osj-convert-license:
    runs-on: ubuntu-latest

    steps:
      - name: OSJ Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: OSJ Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: OSJ Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install markdown beautifulsoup4

      - name: OSJ Run License Conversion
        run: |
          python osj_bot/git/file_manager.py OSJ_License.md License.txt

      - name: OSJ Commit and Push License Update
        run: |
          git config --global user.name "OSJ Bot"
          git config --global user.email "osj-bot@users.noreply.github.com"

          git add License.txt osj_bot/git/file_map.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "OSJ Bot: Synced OSJ_License.md to License.txt"

          git pull --rebase origin main
          git push origin HEAD:main
`
